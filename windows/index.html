<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heroes 3 VN by Gogetto</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const ua = navigator.userAgent;
        const ios =
          /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = ios ? "manifest-ios.webmanifest" : "manifest.webmanifest";
        document.head.appendChild(link);
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Heroes 3 VN" />
    <meta name="application-name" content="Heroes 3 VN" />
    <meta name="theme-color" content="black" />

      content="Tool lưu trữ link tải/mua Heroes 3 mọi phiên bản kèm hướng dẫn cài đặt bằng tiếng Việt."
    />
