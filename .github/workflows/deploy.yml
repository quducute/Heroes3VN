name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            mobile/package-lock.json

      - run: npm ci
        working-directory: windows
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm ci
        working-directory: mobile

      - run: npx --prefix windows prettier --check .

      - run: npm run lint
        working-directory: windows

      - run: npm run lint
        working-directory: mobile

      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-check"
        working-directory: mobile

  build:
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm run build

      - run: node scripts/buildRoutes.js

      - run: node scripts/fetchVersions.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: windows/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
